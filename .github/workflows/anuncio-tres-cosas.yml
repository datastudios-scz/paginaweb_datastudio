# Graba el anuncio «A tu Power BI le faltan 3 cosas» (ADR-022) a MP4 en los cuatro formatos y los
# publica como archivos del release `anuncio-tres-cosas`. Como el de 55 s (anuncio.yml, ADR-016):
# los videos NO viven en el repositorio; la página oculta /anuncios/tres-cosas/ enlaza a esos
# archivos.
#
# Corre en Windows a propósito: las maquetas de Power BI y del chat usan Segoe UI, que en Linux no
# existe. Cada acción está fijada a un commit SHA, igual que en deploy.yml y anuncio.yml.
name: Grabar el anuncio 3 cosas

on:
  push:
    branches: [main]
    paths:
      - 'src/components/anuncio/**'
      - 'src/scripts/anuncio.ts'
      - 'src/pages/anuncios/tres-cosas.astro'
      - 'src/data/**'
      - 'src/styles/**'
      - 'src/layouts/Base.astro'
      - 'scripts/grabar-anuncio.mjs'
      - '.github/workflows/anuncio-tres-cosas.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anuncio-tres-cosas
  cancel-in-progress: true

jobs:
  grabar:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias exactas del lockfile
        run: npm ci --no-audit --no-fund

      - name: Compilar
        run: npm run build

      - name: Instalar ffmpeg
        run: choco install ffmpeg --no-progress -y

      # La portada: el gancho armado, con los tres pilares a la vista y «Ahorro» encendido (1,2 s):
      # lo primero que tiene que leer un gerente
      - name: Grabar el anuncio
        run: npm run anuncio:video -- --pagina /anuncios/tres-cosas/ --nombre tres-cosas --portada 1.2 --salida videos-tres-cosas

      - name: Publicar en el release anuncio-tres-cosas
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view anuncio-tres-cosas >/dev/null 2>&1; then
            gh release create anuncio-tres-cosas --target "$GITHUB_SHA" \
              --title "Anuncio «A tu Power BI le faltan 3 cosas»" --notes "Se reemplaza solo."
          fi
          gh release upload anuncio-tres-cosas videos-tres-cosas/* --clobber
          gh release edit anuncio-tres-cosas --notes "Videos del anuncio «A tu Power BI le faltan 3 cosas» de datastudio.es/anuncios/tres-cosas/: MP4 de 30 s, 60 cps, BT.709, y su portada por formato. Grabados del commit $GITHUB_SHA. Se vuelven a grabar solos cada vez que cambia el anuncio."
          ls -la videos-tres-cosas
